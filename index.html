<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lost and Found – Intelligent Campus System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--surface:#fff;--peach:#fff3ea;--ink:#222;--muted:#666;--navy:#1b365d;--orange:#e8692a;--maroon:#8b2a1e;--line:#cfcbc0;--found:#0f6b4f;--lost:#9b2a22;--ai:#4b3bb8;--well:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15181d;--surface:#1e2228;--peach:#2a2019;--ink:#eee;--muted:#a9adb4;--navy:#9db8e6;--line:#3b4048;--found:#4fd1a1;--lost:#ff8a7d;--ai:#a99bff;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15181d;--surface:#1e2228;--peach:#2a2019;--ink:#eee;--muted:#a9adb4;--navy:#9db8e6;--line:#3b4048;--found:#4fd1a1;--lost:#ff8a7d;--ai:#a99bff;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.55 Poppins,system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;display:flex;flex-direction:column}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--surface);z-index:10}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--navy);outline-offset:2px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:24px;padding:10px 32px}
header .logo img{height:50px;display:block}
nav{display:flex;gap:6px;margin:0 auto;flex-wrap:wrap;justify-content:center}
nav a{padding:8px 18px;border-radius:8px;font-weight:500}
nav a:hover{background:var(--peach)}
nav a.on{color:var(--orange);font-weight:600}
.btn{border:0;border-radius:10px;padding:12px 22px;font-weight:600;cursor:pointer;background:var(--orange);color:#fff;display:inline-block;text-align:center}
.btn.maroon{background:var(--maroon)}.btn.navy{background:#1b365d}.btn.ghost{background:transparent;color:var(--navy);border:1.5px solid var(--line)}
.btn.sm{padding:7px 14px;font-size:13px;border-radius:8px}.btn:hover{filter:brightness(1.08)}
#menu{display:none;margin-left:auto;background:none;border:1.5px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer}
main{flex:1}
.hero{background:var(--peach);display:grid;grid-template-columns:1fr 1.1fr;align-items:end;gap:24px;padding:56px 48px 0;min-height:330px}
.hero h1{font-size:clamp(28px,4vw,40px);line-height:1.2;color:var(--navy);margin:0 0 26px;font-weight:700}
.hero p{max-width:30em;margin:0 0 34px}.hero .cta{display:flex;gap:26px;flex-wrap:wrap;padding-bottom:56px}
.hero .cta .btn{min-width:200px;padding:16px 26px}
.pics{display:flex;align-items:flex-end;justify-content:center;gap:6px}.pics img{display:block;max-width:100%}
.wrap{max-width:1180px;margin:0 auto;padding:28px 24px 48px}
.searchbar{display:flex;border:2px solid var(--line);border-radius:14px;padding:6px;background:var(--surface);gap:8px;margin:0 0 28px}
.searchbar input{flex:1;border:0;background:transparent;padding:10px 14px;min-width:0}.searchbar input:focus{outline:none}
h2{color:var(--navy);font-size:19px;margin:0 0 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:24px}
.card{border:2px solid var(--line);border-radius:14px;background:var(--surface);padding:18px;cursor:pointer;display:flex;flex-direction:column;text-align:left;width:100%}
.card:hover{border-color:var(--orange)}
.well{height:130px;background:var(--well);border-radius:8px;display:grid;place-items:center;margin-bottom:14px;overflow:hidden;font-size:48px}
.well img{max-height:100%;max-width:100%;object-fit:contain}
.card h3{margin:0 0 6px;font-size:16px}.meta{display:flex;justify-content:space-between;font-size:14px;gap:8px}
.f{color:var(--found)}.l{color:var(--lost)}.ai{color:var(--ai);font-weight:700;font-size:13px}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-top:44px}
.step{border-left:4px solid var(--orange);padding:4px 0 4px 14px}.step b{display:block;color:var(--navy)}.step span{font-size:14px;color:var(--muted)}
.panel{max-width:720px;margin:0 auto;border:2px solid var(--line);border-radius:16px;padding:28px;background:var(--surface)}
.panel h1{margin:0 0 4px;color:var(--navy);font-size:26px}.sub{color:var(--muted);margin:0 0 22px}
label{display:block;font-weight:500;font-size:14px;margin:14px 0 5px}
input,select,textarea{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface)}
textarea{min-height:84px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.err{color:var(--lost);font-size:13px;margin-top:6px;min-height:1em}
.hint{font-size:13px;color:var(--muted)}
.tabs{display:flex;gap:8px;margin-bottom:8px}.tabs button{flex:1}
.pill{display:inline-block;border-radius:99px;padding:2px 12px;font-size:13px;font-weight:600;background:var(--peach);color:var(--maroon)}
.pill.ok{background:#dff3ea;color:#0f6b4f}.pill.no{background:#fbe3df;color:#9b2a22}.pill.wait{background:#e8e4fb;color:#4b3bb8}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--navy)}
.scroll{overflow-x:auto}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:16px;margin-bottom:28px}
.stat{border:2px solid var(--line);border-radius:14px;padding:16px;background:var(--surface)}.stat b{display:block;font-size:28px;color:var(--navy)}
.bar{display:grid;grid-template-columns:110px 1fr 30px;gap:10px;align-items:center;margin:8px 0;font-size:14px}.bar i{display:block;height:12px;border-radius:6px;background:var(--orange)}
.match{display:grid;grid-template-columns:1fr auto 1fr;gap:16px;align-items:center;border:2px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px;background:var(--surface)}
.match .pc{text-align:center;font-weight:700;color:var(--ai);font-size:22px}.match .pc small{display:block;font-size:12px;font-weight:500}
.mini{display:flex;gap:12px;align-items:center}.mini .well{width:84px;height:84px;margin:0;font-size:34px;flex:none}
.empty{text-align:center;color:var(--muted);padding:40px 12px;border:2px dashed var(--line);border-radius:14px}
dialog{border:0;border-radius:16px;padding:0;max-width:520px;width:calc(100% - 32px);background:var(--surface);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.5)}.dlg{padding:24px}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#1b365d;color:#fff;padding:12px 20px;border-radius:10px;z-index:30;max-width:90%;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
footer{border-top:1px solid var(--line);padding:22px 32px;text-align:center;font-size:13px;color:var(--muted)}
footer b{color:var(--orange)}
@media(max-width:860px){header{padding:10px 16px;flex-wrap:wrap}#menu{display:block}nav{display:none;width:100%;flex-direction:column;order:5}nav.open{display:flex}header .btn{margin-left:0}
.hero{grid-template-columns:1fr;padding:32px 20px 0}.hero .cta{padding-bottom:24px;gap:14px}.hero .cta .btn{min-width:0;flex:1}.row,.match{grid-template-columns:1fr}.pics{max-width:420px;margin:0 auto}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

const CATS=["Electronics","Stationery","Documents","Accessories","Bags","Clothing","Other"];
const LOCS=["Library","Lab 3","Canteen","Admin block","Main gate","Auditorium","Sports ground"];
const ICON={Electronics:"🔌",Stationery:"✏️",Documents:"📄",Accessories:"👛",Bags:"🎒",Clothing:"🧥",Other:"📦"};
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const sha=async s=>[...new Uint8Array(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s)))].map(b=>b.toString(16).padStart(2,"0")).join("");
const day=n=>new Date(Date.now()-n*864e5).toISOString().slice(0,10);
const KEY="lf-campus-v1";let S,query={q:"",type:"",cat:"",loc:"",date:""};

async function seed(){
 const A="admin@campus.edu",U="student@campus.edu";
 return{user:null,points:{},
 users:[{name:"Admin Office",email:A,phone:"",role:"admin",pw:await sha("admin123")},{name:"Aarav Mehta",email:U,phone:"9800000000",role:"student",pw:await sha("student123")}],
 items:[
 {id:1,type:"found",name:"Pen set",cat:"Stationery",loc:"Library",date:day(1),desc:"Colourful pens and highlighters in a white mesh pen holder.",img:IMG.pens,by:A,secret:"A red gel pen with a chewed cap",status:"Active"},
 {id:2,type:"lost",name:"Keyboard & cables",cat:"Electronics",loc:"Lab 3",date:day(2),desc:"Black USB keyboard with a mouse and tangled cables in a mesh bin.",img:IMG.kb,by:U,status:"Active"},
 {id:3,type:"found",name:"Stationery tray",cat:"Stationery",loc:"Canteen",date:day(2),desc:"Wooden tray with scissors, tape, notebooks and pens.",img:IMG.tray,by:A,secret:"A purple notebook under the scissors",status:"Active"},
 {id:4,type:"lost",name:"Document box",cat:"Documents",loc:"Admin block",date:day(3),desc:"Stack of cardboard boxes labelled documents, letters and photographs.",img:IMG.docs,by:U,status:"Active"},
 {id:5,type:"lost",name:"Pen holder with pens",cat:"Stationery",loc:"Library",date:day(2),desc:"White mesh pen holder with colourful pens and highlighters.",img:"",by:U,status:"Active"},
 {id:6,type:"lost",name:"Stationery organiser tray",cat:"Stationery",loc:"Canteen",date:day(3),desc:"Wooden tray with scissors, tape, notebooks and pens.",img:"",by:U,status:"Active"},
 {id:7,type:"found",name:"Black wallet",cat:"Accessories",loc:"Library",date:day(4),desc:"Black leather wallet, found under a reading table.",img:"",by:A,secret:"Library card with a blue sticker",status:"Active"}],
 claims:[{id:1,itemId:1,user:U,proof:"A red gel pen with a chewed cap",status:"Under Verification",date:day(0)}]};
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
async function init(){
 try{const r=localStorage.getItem(KEY);if(r)S=JSON.parse(r)}catch(e){}
 if(!S||!S.users||!S.items)S=await seed();
 S.items.forEach(i=>{if(i.status==="Active"&&(Date.now()-new Date(i.date))/864e5>90)i.status="Archived"});
 save();route();
}
const tok=s=>new Set(s.toLowerCase().match(/[a-z]{3,}/g)||[]);
function score(a,b){
 const A=tok(a.name+" "+a.desc),B=tok(b.name+" "+b.desc);let n=0;A.forEach(w=>B.has(w)&&n++);
 const t=Math.min(1,n/Math.max(1,Math.min(A.size,B.size))*1.6);
 return Math.min(98,Math.round(((a.cat===b.cat?.3:0)+(a.loc===b.loc?.25:0)+.45*t)*100));
}
const active=t=>S.items.filter(i=>i.type===t&&i.status==="Active");
function best(i){const o=active(i.type==="lost"?"found":"lost");return Math.max(0,...o.map(x=>score(i,x)))}
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove("show"),3200)}
const me=()=>S.user&&S.users.find(u=>u.email===S.user);
const go=h=>{if(location.hash.slice(1)===h)route();else location.hash=h};
const need=()=>{if(!me()){toast("Please log in first.");go("login");return false}return true};

function card(i){
 const b=best(i);
 return `<button class="card" data-id="${i.id}"><div class="well">${i.img?`<img src="${i.img}" alt="${esc(i.name)}">`:ICON[i.cat]||"📦"}</div>
 <h3>${esc(i.name)}</h3><div class="meta"><span class="${i.type==="found"?"f":"l"}">${i.type==="found"?"Found":"Lost"} • ${esc(i.loc)}</span>${b>=60?`<span class="ai">AI ${b}%</span>`:""}</div></button>`;
}
function bindCards(){document.querySelectorAll(".card[data-id]").forEach(c=>c.onclick=()=>openItem(+c.dataset.id))}

function Home(){
 const recent=S.items.filter(i=>i.status==="Active").sort((a,b)=>a.id-b.id).slice(0,4);
 return `<section class="hero"><div><h1>Lost something on campus?</h1>
 <p>Report it in one minute. Our AI finds the match, the admin verifies it, and your belongings come back.</p>
 <div class="cta"><a class="btn" href="#lost">I Lost an Item</a><a class="btn maroon" href="#found">I Found an Item</a></div></div>
 <div class="pics"><img src="${IMG.bin}" alt="Lost and found bin" style="width:36%"><img src="${IMG.kb}" alt="Bin of keyboard and cables" style="width:25%"><img src="${IMG.docs}" alt="Stack of document boxes" style="width:34%"></div></section>
 <div class="wrap"><form class="searchbar" id="hs"><input id="hq" aria-label="Search items" placeholder="Search by item name, category or location (e.g. black wallet, Library)..."><button class="btn navy sm" style="padding:10px 22px">Search</button></form>
 <h2>Recently reported items</h2><div class="grid">${recent.map(card).join("")}</div>
 <div class="steps"><div class="step"><b>1. Report</b><span>Tell us what you lost or found, with a photo, place and date.</span></div><div class="step"><b>2. Match</b><span>The AI compares every lost and found report.</span></div><div class="step"><b>3. Claim</b><span>Owners prove it’s theirs with a detail only they know.</span></div><div class="step"><b>4. Return</b><span>The admin verifies, then the item is handed over.</span></div></div></div>`;
}
function homeBind(){$("#hs").onsubmit=e=>{e.preventDefault();query={q:$("#hq").value,type:"",cat:"",loc:"",date:""};go("search")};bindCards()}

function Login(){
 return `<div class="wrap"><div class="panel"><h1>Welcome</h1><p class="sub">Log in or create an account to report items and track claims.</p>
 <div class="tabs"><button class="btn sm" id="tl">Login</button><button class="btn ghost sm" id="tr">Register</button></div><div id="af"></div>
 <p class="hint">Demo accounts: student@campus.edu / student123 · admin@campus.edu / admin123</p></div></div>`;
}
function loginForm(reg){
 $("#tl").className="btn sm"+(reg?" ghost":"");$("#tr").className="btn sm"+(reg?"":" ghost");
 $("#af").innerHTML=reg?`<form id="f"><label>Full name</label><input name="name" autocomplete="name"><div class="row"><div><label>Email</label><input name="email" type="email"></div><div><label>Phone</label><input name="phone" type="tel"></div></div>
 <div class="row"><div><label>Role</label><select name="role"><option value="student">Student</option><option value="staff">Staff</option></select></div><div><label>Password</label><input name="pw" type="password" autocomplete="new-password"></div></div><div class="err" id="e"></div><button class="btn" style="width:100%;margin-top:8px">Create account</button></form>`
 :`<form id="f"><label>Email</label><input name="email" type="email" autocomplete="username"><label>Password</label><input name="pw" type="password" autocomplete="current-password"><div class="err" id="e"></div><button class="btn" style="width:100%;margin-top:8px">Login</button></form>`;
 $("#f").onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target)),er=$("#e");
  d.email=(d.email||"").trim().toLowerCase();
  if(reg){
   if(!d.name.trim()||!d.email||!d.phone.trim()||d.pw.length<6){er.textContent="Enter your name, email, phone and a password of at least 6 characters.";return}
   if(S.users.some(u=>u.email===d.email)){er.textContent="Email already registered. Log in instead.";return}
   S.users.push({name:d.name.trim(),email:d.email,phone:d.phone.trim(),role:d.role,pw:await sha(d.pw)});S.user=d.email;save();toast("Account created. Welcome, "+d.name.trim().split(" ")[0]+"!");go("home");
  }else{
   const u=S.users.find(u=>u.email===d.email);
   if(!u||u.pw!==await sha(d.pw||"")){er.textContent="Wrong email or password. Check both and try again.";return}
   S.user=u.email;save();toast("Logged in as "+u.name);go(u.role==="admin"?"admin":"home");
  }};
}
function loginBind(){$("#tl").onclick=()=>loginForm(0);$("#tr").onclick=()=>loginForm(1);loginForm(0)}

function Report(t){
 const f=t==="found";
 return `<div class="wrap"><div class="panel"><h1>${f?"Report a found item":"Report a lost item"}</h1><p class="sub">${f?"Thank you for being honest. Add what you found and where it is now.":"The more detail you add, the better the AI can match it."}</p>
 <form id="f" novalidate><label>Item name</label><input name="name" placeholder="e.g. Black wallet">
 <div class="row"><div><label>Category</label><select name="cat">${CATS.map(c=>`<option>${c}</option>`).join("")}</select></div><div><label>${f?"Place found":"Place lost"}</label><select name="loc">${LOCS.map(c=>`<option>${c}</option>`).join("")}</select></div></div>
 <div class="row"><div><label>Date</label><input type="date" name="date" value="${day(0)}" max="${day(0)}"></div><div><label>Photo (JPG or PNG, under 5 MB)</label><input type="file" name="photo" accept="image/png,image/jpeg"></div></div>
 <label>Description</label><textarea name="desc" placeholder="Colour, brand, size, marks..."></textarea>
 ${f?`<label>Where is it kept now?</label><input name="kept" placeholder="e.g. Library help desk">
 <label>Hidden detail (never shown publicly)</label><input name="secret" placeholder="Something only the real owner would know"><div class="hint">The admin uses this to check ownership claims.</div>`:""}
 <div class="err" id="e"></div><button class="btn ${f?"maroon":""}" style="width:100%;margin-top:8px">${f?"Submit found report":"Submit lost report"}</button></form></div></div>`;
}
function shrink(file){return new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,360/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*k;c.height=im.height*k;c.getContext("2d").drawImage(im,0,0,c.width,c.height);ok(c.toDataURL("image/jpeg",.8))};im.onerror=no;im.src=r.result};r.onerror=no;r.readAsDataURL(file)})}
function reportBind(t){
 $("#f").onsubmit=async e=>{e.preventDefault();if(!need())return;const fm=new FormData(e.target),d=Object.fromEntries(fm),er=$("#e"),p=fm.get("photo");
  if(!d.name.trim()){er.textContent="Item name is required.";return}
  if(!d.desc.trim()){er.textContent="Add a short description so others can recognise the item.";return}
  if(t==="found"&&!(d.secret||"").trim()){er.textContent="Add a hidden detail so the real owner can be verified.";return}
  let img="";
  if(p&&p.size){if(!/^image\/(png|jpeg)$/.test(p.type)||p.size>5e6){er.textContent="Photo rejected. Use a JPG or PNG under 5 MB.";return}try{img=await shrink(p)}catch(x){er.textContent="That photo could not be read. Try another file.";return}}
  const it={id:Date.now(),type:t,name:d.name.trim(),cat:d.cat,loc:d.loc,date:d.date,desc:d.desc.trim(),img,by:S.user,status:"Active"};
  if(t==="found"){it.secret=d.secret.trim();it.kept=(d.kept||"").trim()}
  S.items.push(it);save();const n=active(t==="lost"?"found":"lost").filter(o=>score(it,o)>=50).length;
  toast(n?`Report saved. ${n} possible match${n>1?"es":""} found. Match alert sent.`:"Report saved. We’ll alert you when a match appears.");go(n&&t==="lost"?"matches":"home");
 }}

function Search(){
 const o=(a,v)=>a.map(x=>`<option ${x===v?"selected":""}>${x}</option>`).join("");
 const r=S.items.filter(i=>i.status==="Active"&&(!query.type||i.type===query.type)&&(!query.cat||i.cat===query.cat)&&(!query.loc||i.loc===query.loc)&&(!query.date||i.date>=query.date)&&(!query.q.trim()||query.q.toLowerCase().split(/\s+/).every(w=>(i.name+" "+i.cat+" "+i.loc+" "+i.desc).toLowerCase().includes(w))));
 return `<div class="wrap"><h2>Search & filter</h2><form class="searchbar" id="sf"><input id="sq" aria-label="Keyword" value="${esc(query.q)}" placeholder="Keyword, e.g. black wallet"><button class="btn navy sm" style="padding:10px 22px">Search</button></form>
 <div class="row" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:24px"><select id="ft" aria-label="Type"><option value="">Lost and found</option><option value="lost" ${query.type==="lost"?"selected":""}>Lost</option><option value="found" ${query.type==="found"?"selected":""}>Found</option></select>
 <select id="fc" aria-label="Category"><option value="">All categories</option>${o(CATS,query.cat)}</select><select id="fl" aria-label="Location"><option value="">All locations</option>${o(LOCS,query.loc)}</select><input type="date" id="fd" aria-label="Reported since" value="${query.date}"></div>
 ${r.length?`<div class="grid">${r.map(card).join("")}</div>`:`<div class="empty"><b>No items found</b><br>Try fewer words or clear a filter. You can also <a href="#lost" style="color:var(--orange);font-weight:600">report it as lost</a>.</div>`}</div>`;
}
function searchBind(){
 const run=()=>{query={q:$("#sq").value,type:$("#ft").value,cat:$("#fc").value,loc:$("#fl").value,date:$("#fd").value};route()};
 $("#sf").onsubmit=e=>{e.preventDefault();run()};["#ft","#fc","#fl","#fd"].forEach(s=>$(s).onchange=run);bindCards();
}

function Matches(){
 if(!me())return Gate("Log in to see your match results.");
 const u=me(),mine=S.items.filter(i=>i.type==="lost"&&i.status==="Active"&&(u.role==="admin"||i.by===u.email));
 const pairs=[];mine.forEach(l=>active("found").forEach(f=>{const s=score(l,f);if(s>=50)pairs.push({l,f,s})}));pairs.sort((a,b)=>b.s-a.s);
 const mini=i=>`<div class="mini"><div class="well">${i.img?`<img src="${i.img}" alt="">`:ICON[i.cat]}</div><div><b>${esc(i.name)}</b><div class="hint">${esc(i.loc)} • ${esc(i.date)}</div></div></div>`;
 return `<div class="wrap"><h2>Match results</h2>${pairs.length?pairs.map(p=>`<div class="match">${mini(p.l)}<div class="pc">${p.s}%<small>AI match</small><button class="btn sm" data-c="${p.f.id}" style="margin-top:8px">View & claim</button></div>${mini(p.f)}</div>`).join(""):`<div class="empty"><b>No matches yet</b><br>We compare every new report automatically. <a href="#lost" style="color:var(--orange);font-weight:600">Report a lost item</a> to start.</div>`}</div>`;
}
function matchBind(){document.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>openItem(+b.dataset.c))}

function Claims(){
 if(!me())return Gate("Log in to track your claims.");
 const u=me(),cl=S.claims.filter(c=>c.user===u.email),pts=S.points[u.email]||0;
 const cls={"Approved":"ok","Rejected":"no","Under Verification":"wait"};
 return `<div class="wrap"><div class="stats"><div class="stat"><b>${cl.length}</b>My claims</div><div class="stat"><b>${pts}</b>Campus Hero points${pts>=10?" · Honest Finder badge":""}</div></div><h2>My claims</h2>
 ${cl.length?`<div class="scroll"><table><tr><th>Item</th><th>Claimed on</th><th>Your proof</th><th>Status</th></tr>${cl.map(c=>{const i=S.items.find(x=>x.id===c.itemId)||{};return`<tr><td>${esc(i.name)}<div class="hint">${esc(i.loc)}</div></td><td>${esc(c.date)}</td><td>${esc(c.proof)}</td><td><span class="pill ${cls[c.status]||""}">${c.status}</span>${c.status==="Approved"?`<div class="hint">Collect it from the admin office.</div>`:""}</td></tr>`}).join("")}</table></div>`:`<div class="empty"><b>No claims yet</b><br>Open a found item and choose “Claim this item”. <a href="#search" style="color:var(--orange);font-weight:600">Search items</a></div>`}</div>`;
}

function Gate(m,deny){return `<div class="wrap"><div class="panel" style="text-align:center"><h1>${deny?"Access denied":"Login needed"}</h1><p class="sub">${m}</p>${deny?`<a class="btn" href="#home">Back to home</a>`:`<a class="btn" href="#login">Go to login</a>`}</div></div>`}

function Admin(){
 const u=me();if(!u)return Gate("Log in as an admin to open the dashboard.");
 if(u.role!=="admin")return Gate("Only the admin can verify claims and manage listings.",1);
 const it=id=>S.items.find(i=>i.id===id)||{},pend=S.claims.filter(c=>c.status==="Under Verification"),
 hot=LOCS.map(l=>[l,S.items.filter(i=>i.type==="lost"&&i.loc===l).length]).filter(x=>x[1]).sort((a,b)=>b[1]-a[1]),mx=Math.max(1,...hot.map(h=>h[1]));
 return `<div class="wrap"><div class="stats"><div class="stat"><b>${S.items.length}</b>Total reports</div><div class="stat"><b>${S.items.filter(i=>i.status==="Active").length}</b>Active items</div><div class="stat"><b>${pend.length}</b>Claims to verify</div><div class="stat"><b>${S.items.filter(i=>i.status==="Returned").length}</b>Returned</div></div>
 <h2>Claims to verify</h2>${pend.length?pend.map(c=>`<div class="match" style="grid-template-columns:1fr auto"><div><b>${esc(it(c.itemId).name)}</b> claimed by ${esc((S.users.find(x=>x.email===c.user)||{}).name||c.user)}<br><span class="hint">Owner’s proof:</span> ${esc(c.proof)}<br><span class="hint">Finder’s hidden detail:</span> <b>${esc(it(c.itemId).secret||"none recorded")}</b></div><div style="display:flex;gap:8px"><button class="btn sm" data-a="${c.id}">Approve</button><button class="btn maroon sm" data-r="${c.id}">Reject</button></div></div>`).join(""):`<div class="empty">No claims waiting. New claims appear here.</div>`}
 <h2 style="margin-top:32px">Lost-item hotspots</h2>${hot.map(h=>`<div class="bar"><span>${esc(h[0])}</span><i style="width:${h[1]/mx*100}%"></i><b>${h[1]}</b></div>`).join("")}
 <h2 style="margin-top:32px">All listings</h2><div class="scroll"><table><tr><th>Item</th><th>Type</th><th>Place</th><th>Date</th><th>Status</th><th></th></tr>${S.items.slice().reverse().map(i=>`<tr><td>${esc(i.name)}</td><td>${i.type}</td><td>${esc(i.loc)}</td><td>${esc(i.date)}</td><td><span class="pill">${i.status}</span></td><td>${i.status==="Active"?`<button class="btn ghost sm" data-x="${i.id}">Archive</button> `:""}<button class="btn ghost sm" data-d="${i.id}">Delete</button></td></tr>`).join("")}</table></div></div>`;
}
function adminBind(){
 const set=(id,st)=>{const c=S.claims.find(x=>x.id===id),i=S.items.find(x=>x.id===c.itemId);c.status=st;
  if(st==="Approved"){i.status="Returned";S.points[i.by]=(S.points[i.by]||0)+10}save();toast(st==="Approved"?"Claim approved. Item marked Returned.":"Claim rejected. The user is informed.");route()};
 document.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>set(+b.dataset.a,"Approved"));
 document.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>set(+b.dataset.r,"Rejected"));
 document.querySelectorAll("[data-x]").forEach(b=>b.onclick=()=>{S.items.find(i=>i.id===+b.dataset.x).status="Archived";save();route()});
 document.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{S.items=S.items.filter(i=>i.id!==+b.dataset.d);save();route()});
}

function openItem(id){
 const i=S.items.find(x=>x.id===id),u=me(),d=$("#dlg"),mine=u&&i.by===u.email,
 done=u&&S.claims.some(c=>c.itemId===id&&c.user===u.email);
 let act="";
 if(i.type==="found"&&i.status==="Active"){
  act=!u?`<a class="btn" href="#login" id="lg">Log in to claim</a>`:mine?`<p class="hint">You reported this item.</p>`:done?`<p class="hint">You already claimed this item. Track it in My Claims.</p>`
  :`<form id="cf"><label>Prove it’s yours</label><textarea name="proof" placeholder="Describe a detail that isn’t visible in the photo: a mark, the wallpaper, what’s inside…"></textarea><div class="err" id="ce"></div><button class="btn" style="width:100%">Claim this item</button></form>`;
 }
 $("#dlgBody").innerHTML=`<div class="well" style="height:190px">${i.img?`<img src="${i.img}" alt="${esc(i.name)}">`:ICON[i.cat]}</div><h2 style="margin-bottom:4px">${esc(i.name)}</h2>
 <p style="margin:0 0 8px"><span class="${i.type==="found"?"f":"l"}"><b>${i.type==="found"?"Found":"Lost"}</b></span> • ${esc(i.cat)} • ${esc(i.loc)} • ${esc(i.date)}</p><p>${esc(i.desc)}</p>
 <p class="hint">Contact details stay private until the admin approves a claim.</p>${act}<button class="btn ghost sm" id="cx" style="margin-top:12px">Close</button>`;
 d.showModal();$("#cx").onclick=()=>d.close();if($("#lg"))$("#lg").onclick=()=>d.close();
 if($("#cf"))$("#cf").onsubmit=e=>{e.preventDefault();const p=new FormData(e.target).get("proof").trim();
  if(!p){$("#ce").textContent="Enter a private detail so the admin can verify you.";return}
  S.claims.push({id:Date.now(),itemId:id,user:u.email,proof:p,status:"Under Verification",date:day(0)});save();d.close();toast("Claim sent. Status: Under Verification.");go("claims");route()};
}
$("#dlg").addEventListener("click",e=>{if(e.target.id==="dlg")e.target.close()});

function chrome(r){
 const u=me(),L=[["home","Home"],["lost","Report Lost"],["found","Report Found"],["search","Search"],...(u?[["matches","Matches"]]:[]),["claims","My Claims"],...(u&&u.role==="admin"?[["admin","Admin"]]:[])];
 $("#nav").innerHTML=L.map(x=>`<a href="#${x[0]}" class="${x[0]===r?"on":""}">${x[1]}</a>`).join("");
 $("#auth").innerHTML=u?`<span class="hint" style="margin-right:10px">${esc(u.name.split(" ")[0])}</span><button class="btn sm" id="lo">Logout</button>`:`<a class="btn" href="#login">Login</a>`;
 if(u)$("#lo").onclick=()=>{S.user=null;save();toast("Logged out.");go("home");route()};
 $("#nav").classList.remove("open");$("#menu").setAttribute("aria-expanded","false");
}
function route(){
 let r=location.hash.slice(1)||"home";const V={home:[Home,homeBind],login:[Login,loginBind],lost:[()=>Report("lost"),()=>reportBind("lost")],found:[()=>Report("found"),()=>reportBind("found")],search:[Search,searchBind],matches:[Matches,matchBind],claims:[Claims,()=>{}],admin:[Admin,adminBind]};
 if(!V[r])r="home";
 if((r==="lost"||r==="found")&&!me()){$("#app").innerHTML=Gate("Log in to report an item.");chrome(r);return}
 $("#app").innerHTML=V[r][0]();chrome(r);
 V[r][1]();
 if(!(r==="lost"||r==="found"))window.scrollTo(0,0);
}
$("#menu").onclick=()=>{const o=$("#nav").classList.toggle("open");$("#menu").setAttribute("aria-expanded",o)};
addEventListener("hashchange",route);
init();
</script>
</body>
